version: '3.8'

services:
  running-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: running-app:latest
    container_name: running-service
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - CORS_ORIGIN=*
      - DEFAULT_ROOM_CODE=default
      - DB_PATH=./data/running.sqlite
      - UPLOAD_DIR=./uploads
      - STATIC_DIR=../
    volumes:
      - ./server/data:/app/server/data
      - ./server/uploads:/app/server/uploads
